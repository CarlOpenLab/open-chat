# Gateway settings. The server is a stateless proxy: each chat request carries
# the forwarding target (baseUrl / apiKey / api) in its body. Manual provider
# management in the browser UI was removed — models come from the local opencode
# integration below. Nothing provider-related lives in this file.
#
# Copy this file to config/providers.toml (git-ignored) and adjust as needed.

# Gateway bearer token. Omit or leave empty to disable auth.
# When set, clients must send `Authorization: Bearer <gateway_api_key>`.
# gateway_api_key = "change-me"

bind_addr = "127.0.0.1:8082"

# Optional. Omit or leave empty to disable CORS (use a reverse proxy instead).
# Use ["*"] for development, or list exact origins for production.
cors_allowed_origins = ["http://localhost:3000"]

# Web search (optional). Powers the "联网搜索" toggle in the UI.
# Register at https://tavily.com and paste your API key below (or reference a
# server environment variable: api_key = "$TAVILY_API_KEY" so the key never
# appears in this file). Omit the [search] table or set provider = "disabled"
# to turn it off.
[search]
provider = "tavily"
api_key = "replace-with-your-tavily-key"
max_results = 5
search_depth = "basic" # "basic" or "advanced"
include_answer = true

# Legacy local-model catalog via opencode. Optional.
#
# When enabled, the server drives a local `opencode serve` (HTTP + SSE, the
# same transport): models/providers are discovered from the local
# opencode — `GET /api/model` lists the available models (free `opencode/*`,
# ids look like `opencode/nemotron-3.5-lightning-free`) and
# `GET /config/providers` supplies every configured provider, including the
# paid `opencode-go/*` models unlocked by your opencode GO plan. Chat requests
# are forwarded to the local opencode instead of a remote baseUrl/apiKey, so
# the frontend model picker shows all of these models automatically.
# Omit the [local] table or set enabled = false to keep the stateless proxy only.
[local]
enabled = true
# Path to the opencode binary. Leave empty to look it up in PATH.
# binary = "opencode"
# Working directory for `opencode serve`. Leave empty to use the server's cwd.
# cwd = "/Users/carl"
# Agent to use: "build" or "plan".
# agent = "build"
# Frontend-conversation -> opencode-session cache upper bound.
# max_sessions = 50
# Idle sessions are reaped after this many ms.
# session_idle_ms = 1800000

# Local CLI compatibility layer. The server detects commands from the inherited
# PATH plus common Homebrew, local, Bun, Cargo, mise and Volta directories.
# Native transports do not require separate ACP adapters:
#   codex    -> codex app-server --stdio
#   claude   -> claude stream-json stdin/stdout
#   pi       -> pi --mode rpc --approve
#   opencode -> opencode serve (HTTP + SSE)
# Use transport = "acp" only for a CLI/adapter that actually speaks ACP.
[acp]
enabled = true
# cwd = "/absolute/path/to/your/workspace"
permission_timeout_ms = 300000

[[acp.agents]]
id = "codex"
name = "Codex"
description = "OpenAI Codex CLI via native app-server"
transport = "codex"
command = "codex"
cli_command = "codex"
args = []

[[acp.agents]]
id = "opencode"
name = "OpenCode"
description = "OpenCode CLI via its local HTTP server"
transport = "opencode"
command = "opencode"
cli_command = "opencode"
args = []

[[acp.agents]]
id = "claude"
name = "Claude Code"
description = "Claude Code CLI via native stream-json"
transport = "claude"
command = "claude"
cli_command = "claude"
args = []

[[acp.agents]]
id = "pi"
name = "Pi"
description = "Pi coding agent via native RPC mode"
transport = "pi"
command = "pi"
cli_command = "pi"
args = []
