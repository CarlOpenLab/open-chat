name: Release

# Pushing a vX.Y.Z tag builds every platform and publishes it, with the
# signed update files, to the GitHub release of that tag:
#
#   git tag v0.0.3
#   git push origin v0.0.3
#
# The updater signing key is the repository secret MYGO_UPDATER_PRIVATE_KEY:
# the contents of the mygo-update.key that `mygo keygen` writes, whose public
# half is committed in mygo.config.ts. Installed apps verify every update
# against the public key built into the release, so the same key has to sign
# every future version.
#
# The macOS row also signs with an Apple Development identity when
# MACOS_CERTIFICATE (a base64 .p12) and MACOS_CERTIFICATE_PASSWORD are set:
# TCC grants (files and folders) follow the app's code signature, and ad-hoc
# signatures change on every build. Without them the app is ad-hoc signed and
# users may have to grant access again after an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          EXPECTED="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($EXPECTED)"
            exit 1
          fi

      - name: Check the update signing key is set
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error title=Update signing key missing::MYGO_UPDATER_PRIVATE_KEY is not set. Put the mygo-update.key next to the public key in mygo.config.ts into the repository secret."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sidecar
      - run: pnpm typecheck
      - run: go test ./...

  draft:
    name: Create Draft Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The draft exists before any build starts, so every platform uploads
      # into the same release; without it each `mygo build -upload` would
      # create a draft of its own.
      - name: Create the draft release with the changelog notes
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; keeping it"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$version" '
            $0 ~ "^## " v "[[:space:]]*$" { found = 1; next }
            found && $0 ~ "^## " { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || printf 'open-chat %s\n' "$GITHUB_REF_NAME" > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes"

  build:
    name: Build (${{ matrix.name }})
    needs: [check, draft]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: "darwin/arm64,darwin/amd64"
          - name: Windows
            os: windows-latest
            platform: "windows/amd64"
          - name: Linux
            os: ubuntu-latest
            platform: "linux/amd64"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache NSIS (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # TCC grants (files and folders) are bound to the app's code signature;
      # an ad-hoc signature changes cdhash on every build, so users have to
      # grant access again after each update. Import the same Apple
      # Development identity Gloss uses so the designated requirement stays
      # put. Without the secrets the app is ad-hoc signed and still ships.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning title=macOS not signed::no MACOS_CERTIFICATE secret; the app is ad-hoc signed, so macOS may ask for folder access again after an update"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Apple Development: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error title=macOS signing identity missing::the certificate holds no Apple Development identity"
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # -upload puts the installers (dmg, setup exe, deb, rpm, tar.gz) and the
      # signed update files (archives, deltas, update-<target>.json) on the
      # draft release. The manifests go last, so they never point at a file
      # that is not there yet.
      - name: Build and upload ${{ matrix.name }} packages
        shell: bash
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          sign=()
          if [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            sign=(-sign "$MACOS_SIGNING_IDENTITY")
          fi
          pnpm exec mygo build -platform "${{ matrix.platform }}" "${sign[@]}" -upload

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Publishing makes the release the latest, which is where installed
      # apps read their update manifests from.
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
