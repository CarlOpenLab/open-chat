name: Release

# Pushing a vX.Y.Z tag builds every platform and publishes it, with the
# signed update files, to the GitHub release of that tag:
#
#   git tag v0.0.3
#   git push origin v0.0.3
#
# The updater signing key is the repository secret MYGO_UPDATER_PRIVATE_KEY:
# the contents of the mygo-update.key that `mygo keygen` writes. Installed
# apps verify every update against the public key built into the release, so
# the same key has to sign every future version. The public half is derived
# from the secret below, so there is no second value to keep in sync.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    outputs:
      public_key: ${{ steps.key.outputs.public_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          EXPECTED="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($EXPECTED)"
            exit 1
          fi

      - name: Derive the update public key
        id: key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error title=Update signing key missing::MYGO_UPDATER_PRIVATE_KEY is not set. Run 'mygo keygen' once, then 'gh secret set MYGO_UPDATER_PRIVATE_KEY < mygo-update.key'."
            exit 1
          fi
          # Ed25519 private keys are the 32-byte seed followed by the 32-byte
          # public key, both base64-encoded as a whole by mygo keygen.
          public_key="$(printf '%s' "$MYGO_UPDATER_PRIVATE_KEY" | base64 -d | tail -c 32 | base64 | tr -d '\n')"
          if [ -z "$public_key" ]; then
            echo "::error title=Update signing key invalid::MYGO_UPDATER_PRIVATE_KEY does not decode to an Ed25519 private key."
            exit 1
          fi
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"
          echo "MYGO_UPDATER_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sidecar
      - run: pnpm typecheck
      - run: go test ./...

  draft:
    name: Create Draft Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The draft exists before any build starts, so every platform uploads
      # into the same release; without it each `mygo build -upload` would
      # create a draft of its own.
      - name: Create the draft release with the changelog notes
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; keeping it"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$version" '
            $0 ~ "^## " v "[[:space:]]*$" { found = 1; next }
            found && $0 ~ "^## " { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || printf 'open-chat %s\n' "$GITHUB_REF_NAME" > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes"

  build:
    name: Build (${{ matrix.name }})
    needs: [check, draft]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: "darwin/arm64,darwin/amd64"
          - name: Windows
            os: windows-latest
            platform: "windows/amd64"
          - name: Linux
            os: ubuntu-latest
            platform: "linux/amd64"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache NSIS (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # -upload puts the installers (dmg, setup exe, deb, rpm, tar.gz) and the
      # signed update files (archives, deltas, update-<target>.json) on the
      # draft release. The manifests go last, so they never point at a file
      # that is not there yet.
      - name: Build and upload ${{ matrix.name }} packages
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_UPDATER_PUBLIC_KEY: ${{ needs.check.outputs.public_key }}
        run: pnpm exec mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Publishing makes the release the latest, which is where installed
      # apps read their update manifests from.
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
